name: Android CI

on:
  push:
    branches: ["**"]
    # tag 也要跑一次 CI：发版清单要求「tag 上的 CI 重跑过一次」，不能只靠 main 的绿灯
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # flavor 拆分后：direct = 个人自用（含常驻守护服务），play = 上架包（manifest 删除该服务）
  DIRECT_TEST: testDirectDebugUnitTest
  DIRECT_LINT: lintDirectDebug

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 36
        run: |
          SDKMANAGER=sdkmanager
          command -v sdkmanager >/dev/null 2>&1 || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test, lint and build (both flavors)
        run: |
          ./gradlew "$DIRECT_TEST" "$DIRECT_LINT" testPlayDebugUnitTest \
            assembleDirectDebug assembleDirectRelease assemblePlayRelease

      # 上架包必须在 manifest 层面真的没有常驻守护服务（不只是 BuildConfig 默认值）
      - name: Assert play flavor drops the guard service
        run: |
          MANIFEST=$(find app/build/intermediates -path '*play*' -name AndroidManifest.xml | head -1)
          echo "play manifest: $MANIFEST"
          test -n "$MANIFEST"
          # 注意：manifest 里有注释也提到 AlarmGuardService，这里匹配「服务声明」本身（带引号）
          if grep -q 'AlarmGuardService"' "$MANIFEST"; then
            echo '::error::play flavor manifest 仍包含 AlarmGuardService 声明'
            exit 1
          fi
          if ! grep -q 'RingService"' "$MANIFEST"; then
            echo '::error::play flavor manifest 缺少 RingService（不应删）'
            exit 1
          fi

      - name: Upload direct debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cyclealarm-debug-apk
          path: app/build/outputs/apk/direct/debug/app-direct-debug.apk
          if-no-files-found: error

      # R8 验证用产物：统一改名，避免被误当成可安装的发布包
      - name: Upload unsigned release APK (R8 verification only)
        uses: actions/upload-artifact@v4
        with:
          name: cyclealarm-release-UNSIGNED-not-for-release
          path: app/build/outputs/apk/direct/release/app-direct-release-unsigned.apk
          if-no-files-found: error

      # 崩溃栈还原必需：正式包崩溃后要用这份 mapping 才能定位行号
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: cyclealarm-r8-mapping
          path: app/build/outputs/mapping/directRelease/mapping.txt
          if-no-files-found: error

      - name: Upload unit test + lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclealarm-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-directDebug.html
          if-no-files-found: warn
          retention-days: 7

  # 真机冒烟：在 API 34（Android 14）与 API 36（Android 16）模拟器上跑 Compose instrumentation
  # ——targetSdk 36 的运行时行为（边到边、FGS、通知权限）由此得到真实验证
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 36
        run: |
          SDKMANAGER=sdkmanager
          command -v sdkmanager >/dev/null 2>&1 || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 必须用 flavor 明确的任务名（flavor 拆分后 connectedDebugAndroidTest 是模糊任务）。
      # 模拟器镜像下载/启动偶发失败（Error reading Zip / port 5554 refused），失败后自动重试一次。
      - name: Run instrumentation tests on emulator (attempt 1)
        id: emu1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDirectDebugAndroidTest

      - name: Run instrumentation tests on emulator (attempt 2, retry on infra flake)
        id: emu2
        if: steps.emu1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDirectDebugAndroidTest

      # 两次都失败才算这个 job 失败（第一次失败属基础设施抖动时不应阻塞合并）
      - name: Fail if both attempts failed
        if: steps.emu1.outcome == 'failure' && steps.emu2.outcome == 'failure'
        run: |
          echo '::error::instrumentation 两次尝试都失败（非单纯基础设施抖动时请查看报告）'
          exit 1

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclealarm-instrumentation-api${{ matrix.api-level }}
          # flavor 拆分后报告目录是 connected/<flavor><BuildType>，上传父目录避免路径猜测
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: warn
          retention-days: 7
